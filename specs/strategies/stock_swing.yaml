strategy_id: stock_swing
name: "📈 Stock Swing (Macro Trend & Conviction)"
description: "Optimized for multi-day equity holds on 1H/4H/1D timeframes with volume conviction."
target_timeframes:
  - "1h"
  - "4h"
  - "1d"
entry_threshold: 0.35
indicators:
  - swing_trend
  - macd
  - rsi
  - volume
  - bollinger
  - stochastic
  - williams_r
  - momentum
  - support_resistance
  - breakout_signal
weights:
  swing_trend: 0.40
  macd: 0.30
  rsi: 0.20
  volume: 0.10
  bollinger: 0.0
  stochastic: 0.0
  williams_r: 0.0
  momentum: 0.0
  support_resistance: 0.0
  breakout_signal: 0.0
params:
  ema_fast: 50
  ema_slow: 200
  macd_fast: 12
  macd_slow: 26
  macd_signal: 9
risk:
  tp_atr_multiplier: 3.0
  sl_atr_multiplier: 1.5
  max_risk_pct: 0.02
  trailing_stop: false
