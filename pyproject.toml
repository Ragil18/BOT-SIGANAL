[project]
name = "tradesignal-pro"
version = "2.0.0"
description = "TradeSignal Pro High-Speed Algorithmic Trading Terminal"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "numpy>=2.0.0",
    "pandas>=2.2.0",
    "yfinance>=0.2.50",
    "pydantic>=2.0.0",
    "pyyaml>=6.0.0",
    "requests>=2.31.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
